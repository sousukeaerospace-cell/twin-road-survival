<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ツイン・ロード・サバイバル：ラスト・ディフェンス</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
button,.unit-btn,.item-btn,.upg-btn,#closeUpgrade{-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:'Helvetica Neue',Arial,sans-serif}
#gameCanvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;touch-action:none}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
#startScreen button,#gameOverScreen button,#victoryScreen button{touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,255,255,0.2)}
#topBar{position:absolute;top:env(safe-area-inset-top,0);left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:linear-gradient(180deg,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0) 100%);z-index:10}
#topBar>div{color:#fff;font-size:13px;font-weight:bold;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
.gold-text{color:#ffd700!important}
.wave-text{color:#00e5ff!important}
#hpBarContainer{position:absolute;top:calc(env(safe-area-inset-top,0px) + 38px);left:12px;right:12px;height:8px;background:rgba(0,0,0,0.6);border-radius:4px;overflow:hidden;z-index:10}
#hpBar{height:100%;width:100%;background:linear-gradient(90deg,#ff4444,#ff6b6b);border-radius:4px;transition:width 0.3s}
#hpLabel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 36px);left:12px;color:#fff;font-size:10px;font-weight:bold;z-index:11;text-shadow:0 1px 2px #000}
#unitPanel{position:absolute;bottom:env(safe-area-inset-bottom,0);left:0;width:100%;background:linear-gradient(0deg,rgba(0,0,0,0.92) 0%,rgba(0,0,0,0.7) 80%,rgba(0,0,0,0) 100%);padding:8px 6px 12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;pointer-events:auto;z-index:10}
.unit-btn{width:62px;height:72px;border:2px solid rgba(255,255,255,0.3);border-radius:10px;background:rgba(30,30,50,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:bold;cursor:pointer;position:relative;transition:all 0.15s}
.unit-btn.selected{border-color:#ffd700;background:rgba(60,50,10,0.9);box-shadow:0 0 12px rgba(255,215,0,0.4)}
.unit-btn .icon{font-size:24px;margin-bottom:2px}
.unit-btn .cost{color:#ffd700;font-size:9px}
.unit-btn.disabled{opacity:0.4}
#itemPanel{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;pointer-events:auto;z-index:10}
.item-btn{width:48px;height:48px;border:2px solid rgba(255,100,100,0.5);border-radius:12px;background:rgba(40,10,10,0.85);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;position:relative;color:#fff}
.item-btn .count{position:absolute;bottom:-2px;right:-2px;background:#ff4444;color:#fff;font-size:9px;font-weight:bold;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.item-btn.disabled{opacity:0.3}
#waveAnnounce{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:32px;font-weight:900;text-shadow:0 0 20px rgba(255,0,0,0.8),0 0 40px rgba(255,0,0,0.4);opacity:0;pointer-events:none;z-index:20;text-align:center;white-space:nowrap}
#gameOverScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;pointer-events:auto}
#gameOverScreen h1{color:#ff4444;font-size:36px;margin-bottom:10px;text-shadow:0 0 20px rgba(255,0,0,0.6)}
#gameOverScreen .subtitle{color:#aaa;font-size:16px;margin-bottom:30px}
#gameOverScreen button{padding:14px 40px;font-size:18px;font-weight:bold;background:linear-gradient(135deg,#ffd700,#ff8c00);border:none;border-radius:12px;color:#111;cursor:pointer}
#victoryScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;pointer-events:auto}
#victoryScreen h1{color:#ffd700;font-size:36px;margin-bottom:10px;text-shadow:0 0 20px rgba(255,215,0,0.6)}
#victoryScreen .subtitle{color:#aaa;font-size:16px;margin-bottom:30px}
#victoryScreen button{padding:14px 40px;font-size:18px;font-weight:bold;background:linear-gradient(135deg,#00e5ff,#0088ff);border:none;border-radius:12px;color:#fff;cursor:pointer}
#startScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#0a0a1a 0%,#1a0a0a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;pointer-events:auto}
#startScreen h1{color:#ff4444;font-size:22px;font-weight:900;text-shadow:0 0 30px rgba(255,0,0,0.5);margin-bottom:4px;text-align:center;line-height:1.3}
#startScreen h2{color:#ffd700;font-size:14px;font-weight:bold;margin-bottom:30px}
#startScreen p{color:#888;font-size:12px;margin-bottom:20px;text-align:center;padding:0 30px;line-height:1.6}
#startScreen button{padding:16px 50px;font-size:20px;font-weight:bold;background:linear-gradient(135deg,#ff4444,#ff8800);border:none;border-radius:14px;color:#fff;cursor:pointer;box-shadow:0 0 30px rgba(255,68,68,0.4)}
#upgradePanel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,30,0.95);border:2px solid #ffd700;border-radius:16px;padding:16px;display:none;flex-direction:column;gap:8px;z-index:25;pointer-events:auto;min-width:260px}
#upgradePanel h3{color:#ffd700;font-size:16px;text-align:center;margin-bottom:4px}
.upg-btn{padding:10px;background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.3);border-radius:8px;color:#fff;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.upg-btn:active{background:rgba(255,215,0,0.25)}
.upg-btn .upg-cost{color:#ffd700;font-weight:bold}
#closeUpgrade{padding:8px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;font-size:12px;cursor:pointer;text-align:center;margin-top:4px}
#laneIndicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;display:flex;justify-content:space-around;pointer-events:auto;z-index:5;display:none}
.lane-tap{width:45%;height:200px;border:2px dashed rgba(255,255,255,0.3);border-radius:12px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.5);font-size:14px;font-weight:bold}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
<div id="topBar">
<div class="wave-text" id="waveInfo">WAVE 1/10</div>
<div class="gold-text" id="goldInfo">💰 100</div>
<div id="scoreInfo">SCORE: 0</div>
</div>
<div id="hpLabel">BASE HP</div>
<div id="hpBarContainer"><div id="hpBar"></div></div>

<div id="waveAnnounce"></div>

<div id="itemPanel">
<div class="item-btn" data-item="airstrike">💥<div class="count" id="airCount">2</div></div>
<div class="item-btn" data-item="heal">💚<div class="count" id="healCount">2</div></div>
<div class="item-btn" data-item="shield">🛡<div class="count" id="shieldCount">1</div></div>
<div class="item-btn" data-item="portal">🌀<div class="count" id="portalCount">1</div></div>
</div>

<div id="unitPanel"></div>

<div id="upgradePanel">
<h3>⬆ アップグレード</h3>
<div id="upgradeList"></div>
<div id="closeUpgrade">閉じる</div>
</div>

<div id="startScreen">
<h1>ツイン・ロード・サバイバル</h1>
<h2>〜 ラスト・ディフェンス 〜</h2>
<p>2つの道路を守り抜け！<br>兵士を配置して敵の大群を撃退せよ！<br><br>兵士を選んで道路をタップで配置<br>アイテムをタップして使用</p>
<button id="startBtn">⚔ 出撃 ⚔</button>
</div>

<div id="gameOverScreen">
<h1>💀 防衛失敗 💀</h1>
<div class="subtitle" id="goSubtitle">WAVE 3 で敗北</div>
<button id="retryBtn">再挑戦</button>
</div>

<div id="victoryScreen">
<h1>🏆 勝利！ 🏆</h1>
<div class="subtitle" id="vicSubtitle">全ウェーブクリア！</div>
<button id="replayBtn">もう一度</button>
</div>
</div>

<script>
// ===== GAME ENGINE =====
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let W, H, scale;
let gameState = 'start';
let lastTime = 0;
let dt = 0;
let gameTime = 0;

// Audio context for SFX
let audioCtx = null;
function initAudio() {
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playSfx(freq, dur, type='square', vol=0.08) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  // Use visualViewport on iOS for accurate dimensions
  const vv = window.visualViewport;
  W = vv ? Math.round(vv.width) : window.innerWidth;
  H = vv ? Math.round(vv.height) : window.innerHeight;
  // Ensure valid dimensions
  if (W <= 0 || H <= 0) { W = window.screen.width || 390; H = window.screen.height || 844; }
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = Math.min(W / 390, H / 844);
  // Rebuild offscreen assets
  buildRoadTexture();
  buildCityline();
}
// ===== OFFSCREEN CACHES (declared before resize() to avoid TDZ) =====
let roadTexCanvas = null;
let cityCanvas = null;

window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();
// Re-resize after layout stabilizes on iOS
window.addEventListener('load', function() { setTimeout(resize, 100); });

function buildRoadTexture() {
  // Create a small noise pattern for asphalt look
  roadTexCanvas = document.createElement('canvas');
  roadTexCanvas.width = 64;
  roadTexCanvas.height = 64;
  const rc = roadTexCanvas.getContext('2d');
  rc.fillStyle = '#3a3a42';
  rc.fillRect(0, 0, 64, 64);
  for (let i = 0; i < 300; i++) {
    const v = Math.random() * 20 | 0;
    rc.fillStyle = `rgba(${50+v},${50+v},${55+v},0.5)`;
    rc.fillRect(Math.random()*64|0, Math.random()*64|0, 1, 1);
  }
}

function buildCityline() {
  cityCanvas = document.createElement('canvas');
  cityCanvas.width = W;
  cityCanvas.height = H * 0.2;
  const cc = cityCanvas.getContext('2d');

  // Draw building silhouettes
  const buildingCount = 18 + (W / 30 | 0);
  for (let i = 0; i < buildingCount; i++) {
    const bx = (i / buildingCount) * W - 10;
    const bw = 12 + Math.random() * 30;
    const bh = 20 + Math.random() * 80;
    const shade = 15 + Math.random() * 20 | 0;
    cc.fillStyle = `rgb(${shade},${shade},${shade + 8})`;
    cc.fillRect(bx, cityCanvas.height - bh, bw, bh);

    // Windows
    cc.fillStyle = `rgba(255,200,80,${0.15 + Math.random()*0.3})`;
    for (let wy = cityCanvas.height - bh + 4; wy < cityCanvas.height - 4; wy += 8) {
      for (let wx = bx + 3; wx < bx + bw - 3; wx += 6) {
        if (Math.random() > 0.4) {
          cc.fillRect(wx, wy, 3, 4);
        }
      }
    }
  }
}

// ===== GAME STATE =====
let gold = 100;
let score = 0;
let baseHP = 100;
let maxBaseHP = 100;
let currentWave = 0;
let totalWaves = 10;
let waveActive = false;
let waveTimer = 0;
let waveDelay = 3;
let enemiesSpawned = 0;
let enemiesInWave = 0;
let spawnTimer = 0;
let selectedUnit = null;
let allies = [];
let enemies = [];
let projectiles = [];
let particles = [];
let damageNumbers = [];
let effects = [];
let beamFlashes = []; // muzzle/hit flashes
let items = { airstrike: 2, heal: 2, shield: 1, portal: 1 };
let activeItem = null;
let shieldActive = false;
let shieldTimer = 0;
let upgrades = { atk: 0, hp: 0, speed: 0 };

// ===== ROAD PERSPECTIVE =====
const ROAD_TOP_Y = 0.12;
const ROAD_BOTTOM_Y = 0.78;
const ROAD_TOP_WIDTH = 0.30;
const ROAD_BOTTOM_WIDTH = 0.88;
const LANE_COUNT = 2;

function getRoadBounds(yFrac) {
  const t = (yFrac - ROAD_TOP_Y) / (ROAD_BOTTOM_Y - ROAD_TOP_Y);
  const tc = Math.max(0, Math.min(1, t));
  const w = (ROAD_TOP_WIDTH + (ROAD_BOTTOM_WIDTH - ROAD_TOP_WIDTH) * tc) * W;
  const cx = W / 2;
  return { left: cx - w / 2, right: cx + w / 2, width: w, cx: cx };
}

function getLaneX(lane, yFrac) {
  const b = getRoadBounds(yFrac);
  const laneW = b.width / LANE_COUNT;
  return b.left + laneW * (lane + 0.5);
}

function getScaleAtY(yFrac) {
  const t = (yFrac - ROAD_TOP_Y) / (ROAD_BOTTOM_Y - ROAD_TOP_Y);
  return 0.5 + Math.max(0, Math.min(1, t)) * 0.7;
}

function yFracToScreen(yFrac) {
  return yFrac * H;
}

// ===== UNIT DEFINITIONS =====
const UNIT_TYPES = {
  infantry: { name: '歩兵', icon: '🗡', color: '#44aaff', cost: 15, hp: 80, atk: 12, range: 40, atkSpeed: 0.8, speed: 0 },
  archer: { name: '射手', icon: '🏹', color: '#44ccff', cost: 30, hp: 60, atk: 18, range: 180, atkSpeed: 1.2, speed: 0 },
  mage: { name: '魔法', icon: '🔮', color: '#8866ff', cost: 50, hp: 50, atk: 25, range: 150, atkSpeed: 1.8, speed: 0, aoe: 50 },
  tank: { name: 'タンク', icon: '🛡', color: '#3388ff', cost: 40, hp: 200, atk: 8, range: 35, atkSpeed: 1.0, speed: 0 },
  hero: { name: 'ヒーロー', icon: '⚔', color: '#ffaa22', cost: 100, hp: 300, atk: 40, range: 60, atkSpeed: 0.7, speed: 0 }
};

// ===== ENEMY DEFINITIONS =====
const ENEMY_TYPES = {
  zombie: { name: 'ゾンビ', color: '#668844', hp: 40, atk: 5, speed: 20, reward: 5, size: 1 },
  runner: { name: 'ランナー', color: '#998855', hp: 25, atk: 3, speed: 45, reward: 7, size: 0.8 },
  brute: { name: 'ブルート', color: '#884433', hp: 100, atk: 12, speed: 12, reward: 12, size: 1.3 },
  ghost: { name: 'ゴースト', color: '#7788aa', hp: 55, atk: 8, speed: 28, reward: 10, size: 0.9 },
  bomber: { name: 'ボマー', color: '#886633', hp: 35, atk: 20, speed: 22, reward: 8, size: 1.1 },
  boss: { name: 'ボス', color: '#cc2222', hp: 800, atk: 25, speed: 8, reward: 100, size: 2.2, isBoss: true }
};

// ===== WAVE DATA =====
const WAVES = [
  { enemies: [{ type: 'zombie', count: 8 }], delay: 1.2 },
  { enemies: [{ type: 'zombie', count: 6 }, { type: 'runner', count: 4 }], delay: 1.0 },
  { enemies: [{ type: 'zombie', count: 8 }, { type: 'runner', count: 5 }, { type: 'brute', count: 2 }], delay: 0.9 },
  { enemies: [{ type: 'runner', count: 8 }, { type: 'ghost', count: 4 }], delay: 0.8 },
  { enemies: [{ type: 'zombie', count: 6 }, { type: 'brute', count: 5 }, { type: 'bomber', count: 3 }], delay: 0.8 },
  { enemies: [{ type: 'ghost', count: 8 }, { type: 'bomber', count: 5 }, { type: 'brute', count: 3 }], delay: 0.7 },
  { enemies: [{ type: 'runner', count: 10 }, { type: 'brute', count: 5 }, { type: 'ghost', count: 5 }], delay: 0.6 },
  { enemies: [{ type: 'brute', count: 8 }, { type: 'bomber', count: 6 }, { type: 'ghost', count: 6 }], delay: 0.6 },
  { enemies: [{ type: 'zombie', count: 10 }, { type: 'runner', count: 8 }, { type: 'brute', count: 6 }, { type: 'bomber', count: 4 }, { type: 'ghost', count: 4 }], delay: 0.5 },
  { enemies: [{ type: 'brute', count: 6 }, { type: 'bomber', count: 4 }, { type: 'ghost', count: 4 }, { type: 'boss', count: 1 }], delay: 0.7 }
];

// ===== BUILD UNIT PANEL =====
function buildUnitPanel() {
  const panel = document.getElementById('unitPanel');
  panel.innerHTML = '';
  for (const [key, u] of Object.entries(UNIT_TYPES)) {
    const btn = document.createElement('div');
    btn.className = 'unit-btn' + (gold < u.cost ? ' disabled' : '') + (selectedUnit === key ? ' selected' : '');
    btn.dataset.unit = key;
    btn.innerHTML = `<div class="icon">${u.icon}</div><div>${u.name}</div><div class="cost">💰${u.cost}</div>`;
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); selectUnit(key); });
    btn.addEventListener('click', (e) => { e.preventDefault(); selectUnit(key); });
    panel.appendChild(btn);
  }
  const ubtn = document.createElement('div');
  ubtn.className = 'unit-btn';
  ubtn.style.borderColor = 'rgba(0,229,255,0.5)';
  ubtn.innerHTML = `<div class="icon">⬆</div><div>強化</div><div class="cost" style="color:#0ef">MENU</div>`;
  ubtn.addEventListener('touchstart', (e) => { e.preventDefault(); showUpgradePanel(); });
  ubtn.addEventListener('click', (e) => { e.preventDefault(); showUpgradePanel(); });
  panel.appendChild(ubtn);
}

function selectUnit(key) {
  if (selectedUnit === key) { selectedUnit = null; }
  else { selectedUnit = key; activeItem = null; }
  buildUnitPanel();
  playSfx(800, 0.05, 'sine');
}

// ===== UPGRADES =====
function showUpgradePanel() {
  const panel = document.getElementById('upgradePanel');
  const list = document.getElementById('upgradeList');
  list.innerHTML = '';
  const upgData = [
    { key: 'atk', name: '攻撃力 +15%', cost: 30 + upgrades.atk * 20, desc: `Lv.${upgrades.atk}` },
    { key: 'hp', name: 'HP +20%', cost: 30 + upgrades.hp * 20, desc: `Lv.${upgrades.hp}` },
    { key: 'speed', name: '攻撃速度 +10%', cost: 40 + upgrades.speed * 25, desc: `Lv.${upgrades.speed}` }
  ];
  for (const u of upgData) {
    const btn = document.createElement('div');
    btn.className = 'upg-btn';
    btn.innerHTML = `<span>${u.name} (${u.desc})</span><span class="upg-cost">💰${u.cost}</span>`;
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); buyUpgrade(u.key, u.cost); });
    btn.addEventListener('click', (e) => { e.preventDefault(); buyUpgrade(u.key, u.cost); });
    list.appendChild(btn);
  }
  panel.style.display = 'flex';
}

function closeUpgrade() {
  document.getElementById('upgradePanel').style.display = 'none';
}

function buyUpgrade(key, cost) {
  if (gold >= cost) {
    gold -= cost;
    upgrades[key]++;
    allies.forEach(a => applyUpgrades(a));
    showUpgradePanel();
    updateUI();
    playSfx(1200, 0.1, 'sine');
  }
}

function applyUpgrades(ally) {
  const base = UNIT_TYPES[ally.type];
  ally.atk = base.atk * (1 + upgrades.atk * 0.15);
  ally.maxHp = base.hp * (1 + upgrades.hp * 0.2);
  ally.hp = Math.min(ally.hp, ally.maxHp);
  ally.atkSpeed = base.atkSpeed / (1 + upgrades.speed * 0.1);
}

// ===== ITEMS =====
function useItem(type) {
  if (items[type] <= 0 || gameState !== 'playing') return;

  if (type === 'heal') {
    baseHP = Math.min(maxBaseHP, baseHP + 30);
    allies.forEach(a => { a.hp = Math.min(a.maxHp, a.hp + a.maxHp * 0.4); });
    items.heal--;
    spawnEffect('heal');
    playSfx(600, 0.2, 'sine');
  } else if (type === 'shield') {
    shieldActive = true;
    shieldTimer = 8;
    items.shield--;
    playSfx(400, 0.3, 'triangle');
  } else if (type === 'airstrike') {
    enemies.forEach(e => {
      const dmg = 60 + currentWave * 10;
      e.hp -= dmg;
      spawnDmgNum(getLaneX(e.lane, e.yFrac), yFracToScreen(e.yFrac), dmg, '#ff8800', true);
      spawnExplosion(getLaneX(e.lane, e.yFrac), yFracToScreen(e.yFrac), '#ff4400');
    });
    items.airstrike--;
    screenShake(10, 0.5);
    playSfx(150, 0.4, 'sawtooth', 0.12);
  } else if (type === 'portal') {
    enemies.forEach(e => { e.yFrac = Math.max(ROAD_TOP_Y, e.yFrac - 0.15); });
    items.portal--;
    spawnEffect('portal');
    playSfx(300, 0.3, 'sine');
  }
  updateItemUI();
}

function updateItemUI() {
  document.getElementById('airCount').textContent = items.airstrike;
  document.getElementById('healCount').textContent = items.heal;
  document.getElementById('shieldCount').textContent = items.shield;
  document.getElementById('portalCount').textContent = items.portal;
  document.querySelectorAll('.item-btn').forEach(btn => {
    const type = btn.dataset.item;
    btn.classList.toggle('disabled', items[type] <= 0);
  });
}

// ===== TOUCH / CLICK HANDLING =====
canvas.addEventListener('touchstart', handleTouch, { passive: false });
canvas.addEventListener('click', handleClick);

function handleTouch(e) {
  e.preventDefault();
  const t = e.touches[0];
  handleInput(t.clientX, t.clientY);
}

function handleClick(e) {
  handleInput(e.clientX, e.clientY);
}

function handleInput(x, y) {
  if (gameState !== 'playing') return;
  if (!selectedUnit) return;

  const unit = UNIT_TYPES[selectedUnit];
  if (gold < unit.cost) return;

  const lane = x < W / 2 ? 0 : 1;

  let yFrac = y / H;
  yFrac = Math.max(ROAD_TOP_Y + 0.15, Math.min(ROAD_BOTTOM_Y - 0.05, yFrac));

  const minDist = 25 * getScaleAtY(yFrac);
  const tooClose = allies.some(a => a.lane === lane && Math.abs(yFracToScreen(a.yFrac) - yFracToScreen(yFrac)) < minDist);
  if (tooClose) return;

  gold -= unit.cost;
  const ally = {
    type: selectedUnit,
    lane: lane,
    yFrac: yFrac,
    hp: unit.hp * (1 + upgrades.hp * 0.2),
    maxHp: unit.hp * (1 + upgrades.hp * 0.2),
    atk: unit.atk * (1 + upgrades.atk * 0.15),
    range: unit.range,
    atkSpeed: unit.atkSpeed / (1 + upgrades.speed * 0.1),
    atkTimer: 0,
    aoe: unit.aoe || 0,
    color: unit.color,
    icon: unit.icon,
    animPhase: 0
  };
  allies.push(ally);

  spawnExplosion(getLaneX(lane, yFrac), yFracToScreen(yFrac), unit.color);
  playSfx(500, 0.1, 'sine');

  updateUI();
  buildUnitPanel();
}

// ===== ENEMY SPAWNING =====
let spawnQueue = [];

function startWave(waveIdx) {
  currentWave = waveIdx + 1;
  const wave = WAVES[waveIdx];
  spawnQueue = [];
  for (const eg of wave.enemies) {
    for (let i = 0; i < eg.count; i++) {
      spawnQueue.push(eg.type);
    }
  }
  for (let i = spawnQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [spawnQueue[i], spawnQueue[j]] = [spawnQueue[j], spawnQueue[i]];
  }
  enemiesInWave = spawnQueue.length;
  enemiesSpawned = 0;
  spawnTimer = 0;
  waveActive = true;

  announceWave(waveIdx);
  updateUI();
}

function spawnEnemy(type) {
  const def = ENEMY_TYPES[type];
  const waveScale = 1 + (currentWave - 1) * 0.12;
  const lane = Math.random() < 0.5 ? 0 : 1;
  const e = {
    type: type,
    lane: lane,
    yFrac: ROAD_TOP_Y - 0.03,
    hp: def.hp * waveScale,
    maxHp: def.hp * waveScale,
    atk: def.atk * waveScale,
    speed: def.speed,
    reward: def.reward,
    color: def.color,
    size: def.size,
    isBoss: def.isBoss || false,
    atkTimer: 0,
    animPhase: Math.random() * Math.PI * 2,
    flashTimer: 0
  };
  enemies.push(e);

  if (e.isBoss) {
    announceBoss();
    screenShake(15, 1);
  }
}

// ===== ANNOUNCEMENTS =====
let announceAlpha = 0;
let announceText = '';
let announceTimer = 0;

function announceWave(idx) {
  if (idx === WAVES.length - 1) {
    announceText = '⚠ FINAL WAVE ⚠\nボス出現！';
  } else {
    announceText = `WAVE ${idx + 1}`;
  }
  announceAlpha = 1;
  announceTimer = 2;
}

function announceBoss() {
  announceText = '💀 BOSS 💀';
  announceAlpha = 1;
  announceTimer = 2.5;
  screenShake(20, 1);
}

// ===== SCREEN SHAKE =====
let shakeAmount = 0;
let shakeDuration = 0;
let shakeX = 0, shakeY = 0;

function screenShake(amount, duration) {
  shakeAmount = amount;
  shakeDuration = duration;
}

// ===== PARTICLE SYSTEM =====
function spawnDmgNum(x, y, amount, color, isCrit) {
  damageNumbers.push({
    x: x + (Math.random() - 0.5) * 30,
    y: y - 15,
    amount: Math.floor(amount),
    color: color || '#fff',
    isCrit: isCrit || false,
    life: 1.5,
    maxLife: 1.5,
    vy: -90,
    scale: isCrit ? 2.5 : 1.2
  });
}

function spawnExplosion(x, y, color, count) {
  const n = count || 15;
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 / n) * i + Math.random() * 0.5;
    const speed = 50 + Math.random() * 120;
    // Multi-color: base color + orange + yellow for explosion feel
    const colors = [color, '#ff8800', '#ffcc00', '#ffffff'];
    const c = colors[Math.floor(Math.random() * colors.length)];
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 40,
      color: c,
      life: 0.4 + Math.random() * 0.5,
      maxLife: 0.9,
      size: 2 + Math.random() * 5
    });
  }
  // Shockwave ring
  effects.push({ type: 'shockwave', x: x, y: y, timer: 0.4, maxTimer: 0.4, color: color });
}

function spawnBeamFlash(x, y, size) {
  beamFlashes.push({ x, y, size: size || 12, life: 0.15, maxLife: 0.15 });
}

function spawnEffect(type) {
  effects.push({ type: type, timer: 1.0, maxTimer: 1.0 });
}

// ===== PROJECTILE SYSTEM =====
function fireProjectile(from, to, dmg, color, isAoe, aoeRadius) {
  const fx = getLaneX(from.lane, from.yFrac);
  const fy = yFracToScreen(from.yFrac);
  const tx = getLaneX(to.lane, to.yFrac);
  const ty = yFracToScreen(to.yFrac);
  projectiles.push({
    x: fx, y: fy, tx: tx, ty: ty,
    sx: fx, sy: fy, // start position for beam drawing
    target: to,
    dmg: dmg,
    color: color,
    speed: 400,
    isAoe: isAoe || false,
    aoeRadius: aoeRadius || 0,
    trail: []
  });
  // Muzzle flash at origin
  spawnBeamFlash(fx, fy - 10, 15);
}

// ===== UPDATE =====
function update(dt) {
  if (gameState !== 'playing') return;
  gameTime += dt;

  // Shield timer
  if (shieldActive) {
    shieldTimer -= dt;
    if (shieldTimer <= 0) shieldActive = false;
  }

  // Screen shake
  if (shakeDuration > 0) {
    shakeDuration -= dt;
    shakeX = (Math.random() - 0.5) * shakeAmount * 2;
    shakeY = (Math.random() - 0.5) * shakeAmount * 2;
    shakeAmount *= 0.95;
  } else {
    shakeX = 0; shakeY = 0;
  }

  // Announcement
  if (announceTimer > 0) {
    announceTimer -= dt;
    announceAlpha = Math.min(1, announceTimer * 2);
  }

  // Wave management
  if (!waveActive && enemies.length === 0) {
    waveDelay -= dt;
    if (waveDelay <= 0) {
      if (currentWave < totalWaves) {
        startWave(currentWave);
        waveDelay = 3;
      } else {
        gameState = 'victory';
        document.getElementById('vicSubtitle').textContent = `スコア: ${score} | ゴールド: ${gold}`;
        document.getElementById('victoryScreen').style.display = 'flex';
        return;
      }
    }
  }

  // Spawn enemies
  if (waveActive && spawnQueue.length > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy(spawnQueue.shift());
      enemiesSpawned++;
      spawnTimer = WAVES[currentWave - 1].delay;
    }
  }
  if (waveActive && spawnQueue.length === 0 && enemies.length === 0) {
    waveActive = false;
    waveDelay = 3;
    gold += 10 + currentWave * 5;
    if (currentWave % 3 === 0) {
      items.airstrike++;
      items.heal++;
    }
    if (currentWave % 5 === 0) {
      items.shield++;
      items.portal++;
    }
    updateItemUI();
    buildUnitPanel();
  }

  // Update enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.animPhase += dt * 3;
    e.flashTimer = Math.max(0, e.flashTimer - dt);

    const moveSpeed = e.speed * dt / H;
    e.yFrac += moveSpeed;

    const nearestAlly = findNearestAlly(e);
    if (nearestAlly && getDistY(e, nearestAlly) < 40 * getScaleAtY(e.yFrac)) {
      e.atkTimer -= dt;
      if (e.atkTimer <= 0) {
        nearestAlly.hp -= e.atk;
        spawnDmgNum(getLaneX(nearestAlly.lane, nearestAlly.yFrac), yFracToScreen(nearestAlly.yFrac), e.atk, '#ff4444', false);
        e.atkTimer = 1.0;
        e.yFrac -= moveSpeed;
      }
    }

    if (e.yFrac >= ROAD_BOTTOM_Y + 0.02) {
      const dmg = shieldActive ? e.atk * 0.3 : e.atk;
      baseHP -= dmg;
      spawnExplosion(getLaneX(e.lane, ROAD_BOTTOM_Y), yFracToScreen(ROAD_BOTTOM_Y), '#ff0000', 8);
      enemies.splice(i, 1);
      screenShake(5, 0.2);
      if (baseHP <= 0) {
        baseHP = 0;
        gameState = 'gameover';
        document.getElementById('goSubtitle').textContent = `WAVE ${currentWave} で敗北 | スコア: ${score}`;
        document.getElementById('gameOverScreen').style.display = 'flex';
      }
      continue;
    }

    if (e.hp <= 0) {
      gold += e.reward;
      score += e.reward * 10;
      spawnExplosion(getLaneX(e.lane, e.yFrac), yFracToScreen(e.yFrac), e.color, e.isBoss ? 30 : 15);
      if (e.isBoss) screenShake(15, 0.8);
      playSfx(200 + Math.random() * 100, 0.15, 'square', 0.06);
      enemies.splice(i, 1);
      updateUI();
      buildUnitPanel();
    }
  }

  // Update allies
  for (let i = allies.length - 1; i >= 0; i--) {
    const a = allies[i];
    a.animPhase += dt * 2;
    a.atkTimer -= dt;

    const target = findNearestEnemy(a);
    if (target && a.atkTimer <= 0) {
      const dmg = a.atk;
      const isCrit = Math.random() < 0.15;
      const finalDmg = isCrit ? dmg * 2 : dmg;

      if (a.range > 50) {
        fireProjectile(a, target, finalDmg, a.color, a.aoe > 0, a.aoe);
      } else {
        target.hp -= finalDmg;
        target.flashTimer = 0.1;
        spawnDmgNum(getLaneX(target.lane, target.yFrac), yFracToScreen(target.yFrac), finalDmg, isCrit ? '#ffee00' : '#fff', isCrit);
        if (isCrit) playSfx(1000, 0.08, 'sine');
        // Melee hit flash
        spawnBeamFlash(getLaneX(target.lane, target.yFrac), yFracToScreen(target.yFrac) - 5, 10);
      }
      a.atkTimer = a.atkSpeed;
      playSfx(300 + Math.random() * 200, 0.05, 'square', 0.04);
    }

    if (a.hp <= 0) {
      spawnExplosion(getLaneX(a.lane, a.yFrac), yFracToScreen(a.yFrac), '#888', 8);
      allies.splice(i, 1);
    }
  }

  // Update projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    // Update target position
    if (p.target && enemies.includes(p.target)) {
      p.tx = getLaneX(p.target.lane, p.target.yFrac);
      p.ty = yFracToScreen(p.target.yFrac);
    }
    const dx = p.tx - p.x;
    const dy = p.ty - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 10) p.trail.shift();

    if (dist < 10) {
      // Hit flash
      spawnBeamFlash(p.x, p.y, 18);
      if (p.isAoe) {
        enemies.forEach(e => {
          const ex = getLaneX(e.lane, e.yFrac);
          const ey = yFracToScreen(e.yFrac);
          const d = Math.sqrt((ex - p.x) ** 2 + (ey - p.y) ** 2);
          if (d < p.aoeRadius) {
            const isCrit = Math.random() < 0.1;
            const dmg = isCrit ? p.dmg * 1.5 : p.dmg * 0.7;
            e.hp -= dmg;
            e.flashTimer = 0.1;
            spawnDmgNum(ex, ey, dmg, isCrit ? '#ffee00' : p.color, isCrit);
          }
        });
        spawnExplosion(p.x, p.y, p.color, 12);
      } else {
        if (p.target && enemies.includes(p.target)) {
          const isCrit = Math.random() < 0.15;
          const dmg = isCrit ? p.dmg * 2 : p.dmg;
          p.target.hp -= dmg;
          p.target.flashTimer = 0.1;
          spawnDmgNum(p.tx, p.ty, dmg, isCrit ? '#ffee00' : '#fff', isCrit);
          if (isCrit) playSfx(1000, 0.08, 'sine');
        }
      }
      projectiles.splice(i, 1);
    } else {
      const s = p.speed * dt / dist;
      p.x += dx * s;
      p.y += dy * s;
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 120 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Update damage numbers
  for (let i = damageNumbers.length - 1; i >= 0; i--) {
    const d = damageNumbers[i];
    d.y += d.vy * dt;
    d.vy *= 0.93;
    d.life -= dt;
    d.scale *= 0.997;
    if (d.life <= 0) damageNumbers.splice(i, 1);
  }

  // Update effects
  for (let i = effects.length - 1; i >= 0; i--) {
    effects[i].timer -= dt;
    if (effects[i].timer <= 0) effects.splice(i, 1);
  }

  // Update beam flashes
  for (let i = beamFlashes.length - 1; i >= 0; i--) {
    beamFlashes[i].life -= dt;
    if (beamFlashes[i].life <= 0) beamFlashes.splice(i, 1);
  }

  updateUI();
}

function findNearestEnemy(ally) {
  let best = null, bestDist = Infinity;
  for (const e of enemies) {
    if (e.lane !== ally.lane && ally.range < 100) continue;
    const dy = Math.abs(yFracToScreen(e.yFrac) - yFracToScreen(ally.yFrac));
    const dx = Math.abs(getLaneX(e.lane, e.yFrac) - getLaneX(ally.lane, ally.yFrac));
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < ally.range * getScaleAtY(ally.yFrac) && d < bestDist) {
      bestDist = d;
      best = e;
    }
  }
  return best;
}

function findNearestAlly(enemy) {
  let best = null, bestDist = Infinity;
  for (const a of allies) {
    if (a.lane !== enemy.lane) continue;
    const d = yFracToScreen(a.yFrac) - yFracToScreen(enemy.yFrac);
    if (d > 0 && d < bestDist) {
      bestDist = d;
      best = a;
    }
  }
  return best;
}

function getDistY(a, b) {
  return Math.abs(yFracToScreen(a.yFrac) - yFracToScreen(b.yFrac));
}

// ===== DRAW =====
function draw() {
  // Reset transform and clear canvas explicitly (fixes iOS Safari rendering)
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground();
  drawRoad();
  drawBase();

  if (shieldActive) drawShield();

  // Sort all game entities by yFrac for proper depth
  const allEntities = [];
  for (const e of enemies) allEntities.push({ obj: e, yFrac: e.yFrac, type: 'enemy' });
  for (const a of allies) allEntities.push({ obj: a, yFrac: a.yFrac, type: 'ally' });
  allEntities.sort((a, b) => a.yFrac - b.yFrac);

  for (const ent of allEntities) {
    if (ent.type === 'enemy') drawEnemy(ent.obj);
    else drawAlly(ent.obj);
  }

  // Draw beams / projectiles
  for (const p of projectiles) drawProjectile(p);

  // Beam flashes (additive feel)
  for (const f of beamFlashes) drawBeamFlash(f);

  // Particles
  for (const p of particles) drawParticle(p);

  // Damage numbers (on top of everything)
  for (const d of damageNumbers) drawDmgNum(d);

  // Effects
  for (const e of effects) drawEffect(e);

  // Announcement
  if (announceTimer > 0) drawAnnouncement();

  ctx.restore();
}

// ===== BACKGROUND =====
function drawBackground() {
  // Sky gradient - dark navy to slightly lighter
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  skyGrad.addColorStop(0, '#05071a');
  skyGrad.addColorStop(0.4, '#0c1230');
  skyGrad.addColorStop(0.7, '#151a3a');
  skyGrad.addColorStop(1, '#1a1525');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < 40; i++) {
    const sx = ((i * 137.5 + 50) % W);
    const sy = ((i * 87.3 + 20) % (H * 0.15));
    const sz = 0.5 + (i % 3) * 0.5;
    ctx.beginPath();
    ctx.arc(sx, sy, sz, 0, Math.PI * 2);
    ctx.fill();
  }

  // City silhouette
  if (cityCanvas) {
    const cityY = H * ROAD_TOP_Y - cityCanvas.height * 0.5;
    ctx.globalAlpha = 0.7;
    ctx.drawImage(cityCanvas, 0, cityY);
    ctx.globalAlpha = 1;
  }

  // Ambient haze at horizon
  const hazeGrad = ctx.createLinearGradient(0, H * ROAD_TOP_Y - 30, 0, H * ROAD_TOP_Y + 20);
  hazeGrad.addColorStop(0, 'rgba(20,15,40,0)');
  hazeGrad.addColorStop(0.5, 'rgba(30,20,50,0.5)');
  hazeGrad.addColorStop(1, 'rgba(20,15,30,0)');
  ctx.fillStyle = hazeGrad;
  ctx.fillRect(0, H * ROAD_TOP_Y - 30, W, 50);

  // Ground on sides of road (dark earth/rubble)
  const groundY = H * ROAD_TOP_Y;
  const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
  groundGrad.addColorStop(0, '#15120e');
  groundGrad.addColorStop(1, '#1a1510');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, groundY, W, H - groundY);
}

// ===== ROAD DRAWING =====
function drawRoad() {
  // Draw the road as a filled trapezoid
  const topB = getRoadBounds(ROAD_TOP_Y);
  const botB = getRoadBounds(ROAD_BOTTOM_Y);
  const topY = yFracToScreen(ROAD_TOP_Y);
  const botY = yFracToScreen(ROAD_BOTTOM_Y);

  // Main road surface
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(topB.left, topY);
  ctx.lineTo(topB.right, topY);
  ctx.lineTo(botB.right, botY);
  ctx.lineTo(botB.left, botY);
  ctx.closePath();
  ctx.clip();

  // Asphalt base color gradient (darker at top, lighter at bottom)
  const roadGrad = ctx.createLinearGradient(0, topY, 0, botY);
  roadGrad.addColorStop(0, '#2a2a30');
  roadGrad.addColorStop(0.5, '#353540');
  roadGrad.addColorStop(1, '#404048');
  ctx.fillStyle = roadGrad;
  ctx.fillRect(0, topY, W, botY - topY);

  // Asphalt texture overlay
  if (roadTexCanvas) {
    try {
      const pat = ctx.createPattern(roadTexCanvas, 'repeat');
      if (pat) {
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = pat;
        ctx.fillRect(0, topY, W, botY - topY);
        ctx.globalAlpha = 1;
      }
    } catch(e) {}
  }

  ctx.restore();

  // Road edge lines (white solid)
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';

  // Left edge
  ctx.beginPath();
  const steps = 30;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const yF = ROAD_TOP_Y + t * (ROAD_BOTTOM_Y - ROAD_TOP_Y);
    const b = getRoadBounds(yF);
    const sy = yFracToScreen(yF);
    if (i === 0) ctx.moveTo(b.left, sy);
    else ctx.lineTo(b.left, sy);
  }
  ctx.stroke();

  // Right edge
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const yF = ROAD_TOP_Y + t * (ROAD_BOTTOM_Y - ROAD_TOP_Y);
    const b = getRoadBounds(yF);
    const sy = yFracToScreen(yF);
    if (i === 0) ctx.moveTo(b.right, sy);
    else ctx.lineTo(b.right, sy);
  }
  ctx.stroke();

  // Road shoulder stripes (yellow warning on outside edges)
  ctx.lineWidth = 2;
  for (let side = 0; side < 2; side++) {
    for (let i = 0; i < 20; i++) {
      if (i % 2 !== 0) continue;
      const t0 = i / 20;
      const t1 = (i + 1) / 20;
      const yF0 = ROAD_TOP_Y + t0 * (ROAD_BOTTOM_Y - ROAD_TOP_Y);
      const yF1 = ROAD_TOP_Y + t1 * (ROAD_BOTTOM_Y - ROAD_TOP_Y);
      const b0 = getRoadBounds(yF0);
      const b1 = getRoadBounds(yF1);
      const sy0 = yFracToScreen(yF0);
      const sy1 = yFracToScreen(yF1);

      ctx.strokeStyle = `rgba(255,180,0,${0.3 + t0 * 0.3})`;
      ctx.beginPath();
      if (side === 0) {
        ctx.moveTo(b0.left - 4, sy0);
        ctx.lineTo(b1.left - 4, sy1);
      } else {
        ctx.moveTo(b0.right + 4, sy0);
        ctx.lineTo(b1.right + 4, sy1);
      }
      ctx.stroke();
    }
  }

  // Center divider (white dashed line)
  const dashCount = 25;
  for (let i = 0; i < dashCount; i++) {
    if (i % 2 !== 0) continue;
    const t0 = i / dashCount;
    const t1 = (i + 0.7) / dashCount;
    const yF0 = ROAD_TOP_Y + t0 * (ROAD_BOTTOM_Y - ROAD_TOP_Y);
    const yF1 = ROAD_TOP_Y + Math.min(1, t1) * (ROAD_BOTTOM_Y - ROAD_TOP_Y);
    const b0 = getRoadBounds(yF0);
    const b1 = getRoadBounds(yF1);
    const sy0 = yFracToScreen(yF0);
    const sy1 = yFracToScreen(yF1);

    const lineW = 2 + t0 * 3;
    ctx.strokeStyle = `rgba(255,255,255,${0.5 + t0 * 0.4})`;
    ctx.lineWidth = lineW;
    ctx.beginPath();
    ctx.moveTo(b0.cx, sy0);
    ctx.lineTo(b1.cx, sy1);
    ctx.stroke();
  }

  // Rubble/debris on road sides
  drawRoadDebris();
}

function drawRoadDebris() {
  // Draw small rubble items along the road edges using deterministic random
  for (let i = 0; i < 12; i++) {
    const seed = i * 73.7;
    const t = (seed % 100) / 100;
    const side = i % 2;
    const yF = ROAD_TOP_Y + t * (ROAD_BOTTOM_Y - ROAD_TOP_Y);
    const b = getRoadBounds(yF);
    const sc = getScaleAtY(yF);
    const sy = yFracToScreen(yF);
    const rx = side === 0 ? b.left - 8 * sc - (seed % 15) : b.right + 8 * sc + (seed % 15);

    ctx.fillStyle = `rgba(${40 + (seed % 30)|0},${35 + (seed % 20)|0},${30 + (seed % 15)|0},0.8)`;
    const sz = (3 + (seed % 8)) * sc;
    ctx.fillRect(rx - sz / 2, sy - sz / 2, sz, sz * 0.7);
  }
}

function drawBase() {
  const yFrac = ROAD_BOTTOM_Y;
  const b = getRoadBounds(yFrac);
  const y = yFracToScreen(yFrac);

  // Glowing defense line
  const pulseA = 0.3 + Math.sin(gameTime * 3) * 0.15;
  const glow = ctx.createLinearGradient(b.left, y - 20, b.left, y + 20);
  glow.addColorStop(0, 'rgba(0,120,255,0)');
  glow.addColorStop(0.3, `rgba(0,120,255,${pulseA * 0.5})`);
  glow.addColorStop(0.5, `rgba(0,180,255,${pulseA})`);
  glow.addColorStop(0.7, `rgba(0,120,255,${pulseA * 0.5})`);
  glow.addColorStop(1, 'rgba(0,120,255,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(b.left - 10, y - 20, b.width + 20, 40);

  // Solid defense wall
  const wallGrad = ctx.createLinearGradient(b.left, y - 5, b.left, y + 5);
  wallGrad.addColorStop(0, '#556');
  wallGrad.addColorStop(0.4, '#778');
  wallGrad.addColorStop(1, '#445');
  ctx.fillStyle = wallGrad;
  ctx.fillRect(b.left, y - 5, b.width, 10);

  // Chevron markings
  ctx.strokeStyle = `rgba(255,200,0,${0.5 + Math.sin(gameTime * 2) * 0.2})`;
  ctx.lineWidth = 2;
  for (let x = b.left + 15; x < b.right - 15; x += 25) {
    ctx.beginPath();
    ctx.moveTo(x, y + 3);
    ctx.lineTo(x + 8, y - 3);
    ctx.lineTo(x + 16, y + 3);
    ctx.stroke();
  }
}

// ===== ENEMY DRAWING =====
function drawEnemy(e) {
  const x = getLaneX(e.lane, e.yFrac);
  const y = yFracToScreen(e.yFrac);
  const sc = getScaleAtY(e.yFrac) * e.size;
  const walkCycle = Math.sin(e.animPhase * 2);
  const bob = Math.abs(walkCycle) * 2;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);

  // Ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(0, 6, e.isBoss ? 18 : 9, e.isBoss ? 6 : 3, 0, 0, Math.PI * 2);
  ctx.fill();

  const isFlash = e.flashTimer > 0;

  if (e.isBoss) {
    drawBossEnemy(e, isFlash, bob);
  } else {
    drawNormalEnemy(e, isFlash, bob, walkCycle);
  }

  // HP bar
  const hpRatio = e.hp / e.maxHp;
  const barW = e.isBoss ? 40 : 18;
  const barY = e.isBoss ? -45 : -28;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(-barW / 2 - 1, barY - 1, barW + 2, 5);
  const hpColor = hpRatio > 0.5 ? '#44ff44' : hpRatio > 0.25 ? '#ffcc00' : '#ff3333';
  ctx.fillStyle = hpColor;
  ctx.fillRect(-barW / 2, barY, barW * hpRatio, 3);
  // HP bar border
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(-barW / 2 - 1, barY - 1, barW + 2, 5);

  ctx.restore();
}

function drawBossEnemy(e, isFlash, bob) {
  const bodyColor = isFlash ? '#fff' : e.color;
  const t = gameTime;

  ctx.translate(0, -bob);

  // Aura glow (pulsating)
  const auraR = 30 + Math.sin(t * 4) * 5;
  const auraGrad = ctx.createRadialGradient(0, -15, 5, 0, -15, auraR);
  auraGrad.addColorStop(0, 'rgba(255,30,30,0.3)');
  auraGrad.addColorStop(0.5, 'rgba(255,60,0,0.15)');
  auraGrad.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = auraGrad;
  ctx.beginPath();
  ctx.arc(0, -15, auraR, 0, Math.PI * 2);
  ctx.fill();

  // Legs
  const legSwing = Math.sin(e.animPhase * 2) * 4;
  ctx.fillStyle = darkenColor(bodyColor, 0.6);
  ctx.fillRect(-8, -2, 5, 10);
  ctx.fillRect(3, -2, 5, 10);

  // Main body - armored torso
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(-14, 0);
  ctx.lineTo(-16, -10);
  ctx.lineTo(-12, -25);
  ctx.lineTo(-6, -30);
  ctx.lineTo(0, -32);
  ctx.lineTo(6, -30);
  ctx.lineTo(12, -25);
  ctx.lineTo(16, -10);
  ctx.lineTo(14, 0);
  ctx.closePath();
  ctx.fill();

  // Body highlight
  ctx.fillStyle = lightenColor(bodyColor, 0.3);
  ctx.beginPath();
  ctx.moveTo(-4, -30);
  ctx.lineTo(0, -32);
  ctx.lineTo(4, -30);
  ctx.lineTo(4, -10);
  ctx.lineTo(-4, -10);
  ctx.closePath();
  ctx.fill();

  // Shoulder plates
  ctx.fillStyle = darkenColor(bodyColor, 0.7);
  ctx.beginPath();
  ctx.ellipse(-14, -20, 7, 5, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(14, -20, 7, 5, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Arms
  ctx.fillStyle = bodyColor;
  const armSwing = Math.sin(e.animPhase) * 5;
  ctx.fillRect(-20, -18 + armSwing, 5, 14);
  ctx.fillRect(15, -18 - armSwing, 5, 14);

  // Head
  ctx.fillStyle = darkenColor(bodyColor, 0.8);
  ctx.beginPath();
  ctx.arc(0, -35, 8, 0, Math.PI * 2);
  ctx.fill();

  // Horns
  ctx.strokeStyle = '#ffaa00';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-6, -40);
  ctx.quadraticCurveTo(-10, -52, -15, -50);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(6, -40);
  ctx.quadraticCurveTo(10, -52, 15, -50);
  ctx.stroke();

  // Eyes (glowing)
  ctx.fillStyle = '#ff2200';
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.ellipse(-4, -36, 2.5, 2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(4, -36, 2.5, 2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawNormalEnemy(e, isFlash, bob, walkCycle) {
  const bodyColor = isFlash ? '#ffffff' : e.color;
  const darkBody = isFlash ? '#dddddd' : darkenColor(e.color, 0.7);

  ctx.translate(0, -bob);

  // Legs (walk animation)
  const legA = walkCycle * 4;
  ctx.fillStyle = darkBody;
  ctx.save();
  ctx.translate(-3, 3);
  ctx.rotate(legA * 0.05);
  ctx.fillRect(-2, 0, 4, 8);
  ctx.restore();
  ctx.save();
  ctx.translate(3, 3);
  ctx.rotate(-legA * 0.05);
  ctx.fillRect(-2, 0, 4, 8);
  ctx.restore();

  // Body (torso)
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(-7, 3);
  ctx.lineTo(-8, -6);
  ctx.lineTo(-6, -12);
  ctx.lineTo(0, -14);
  ctx.lineTo(6, -12);
  ctx.lineTo(8, -6);
  ctx.lineTo(7, 3);
  ctx.closePath();
  ctx.fill();

  // Body shading
  ctx.fillStyle = lightenColor(bodyColor, 0.2);
  ctx.beginPath();
  ctx.moveTo(-2, -14);
  ctx.lineTo(2, -14);
  ctx.lineTo(3, -4);
  ctx.lineTo(-3, -4);
  ctx.closePath();
  ctx.fill();

  // Arms (reaching forward animation)
  ctx.fillStyle = bodyColor;
  const armR = Math.sin(e.animPhase * 2) * 6;
  ctx.save();
  ctx.translate(-8, -8);
  ctx.rotate(-0.3 + armR * 0.03);
  ctx.fillRect(-2, 0, 3, 10);
  ctx.restore();
  ctx.save();
  ctx.translate(8, -8);
  ctx.rotate(0.3 - armR * 0.03);
  ctx.fillRect(-1, 0, 3, 10);
  ctx.restore();

  // Head
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.arc(0, -18, 5.5, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  if (e.type === 'ghost') {
    ctx.fillStyle = '#ddeeff';
    ctx.shadowColor = '#aaccff';
    ctx.shadowBlur = 4;
  } else {
    ctx.fillStyle = '#ffcc00';
  }
  ctx.beginPath();
  ctx.ellipse(-2.5, -19, 1.5, 1.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(2.5, -19, 1.5, 1.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Ghost special: semi-transparent + wispy
  if (e.type === 'ghost' && !isFlash) {
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#aaccff';
    ctx.beginPath();
    ctx.ellipse(0, -5, 10, 15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Bomber: backpack
  if (e.type === 'bomber') {
    ctx.fillStyle = '#cc6600';
    ctx.fillRect(-4, -10, 8, 8);
    ctx.fillStyle = '#ff3300';
    ctx.beginPath();
    ctx.arc(0, -6, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ===== ALLY DRAWING =====
function drawAlly(a) {
  const x = getLaneX(a.lane, a.yFrac);
  const y = yFracToScreen(a.yFrac);
  const sc = getScaleAtY(a.yFrac);
  const idle = Math.sin(a.animPhase) * 1;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  ctx.translate(0, -idle);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, 7, 8, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  const baseColor = a.color;
  const darkColor = darkenColor(baseColor, 0.7);
  const lightColor = lightenColor(baseColor, 0.3);
  const isAttacking = a.atkTimer > a.atkSpeed * 0.7;

  // Legs
  ctx.fillStyle = darkColor;
  ctx.fillRect(-4, 2, 3, 7);
  ctx.fillRect(1, 2, 3, 7);

  // Body (torso) - more detailed
  ctx.fillStyle = baseColor;
  ctx.beginPath();
  ctx.moveTo(-7, 3);
  ctx.lineTo(-7, -8);
  ctx.lineTo(-5, -13);
  ctx.lineTo(0, -14);
  ctx.lineTo(5, -13);
  ctx.lineTo(7, -8);
  ctx.lineTo(7, 3);
  ctx.closePath();
  ctx.fill();

  // Torso highlight (center stripe)
  ctx.fillStyle = lightColor;
  ctx.beginPath();
  ctx.moveTo(-2, -13);
  ctx.lineTo(2, -13);
  ctx.lineTo(2, 2);
  ctx.lineTo(-2, 2);
  ctx.closePath();
  ctx.fill();

  // Arms
  ctx.fillStyle = baseColor;
  const armAnim = isAttacking ? -8 : Math.sin(a.animPhase) * 3;
  ctx.save();
  ctx.translate(-7, -9);
  ctx.rotate(-0.2 + armAnim * 0.02);
  ctx.fillRect(-2, 0, 3, 9);
  ctx.restore();
  ctx.save();
  ctx.translate(7, -9);
  ctx.rotate(0.2 - armAnim * 0.02);
  ctx.fillRect(-1, 0, 3, 9);
  ctx.restore();

  // Head
  ctx.fillStyle = '#ffe0c0';
  ctx.beginPath();
  ctx.arc(0, -18, 5, 0, Math.PI * 2);
  ctx.fill();

  // Helmet
  ctx.fillStyle = baseColor;
  ctx.beginPath();
  ctx.arc(0, -20, 5.5, Math.PI, 0);
  ctx.lineTo(5.5, -18);
  ctx.lineTo(-5.5, -18);
  ctx.closePath();
  ctx.fill();

  // Face features
  ctx.fillStyle = '#333';
  ctx.fillRect(-2.5, -19, 1.5, 1.5);
  ctx.fillRect(1, -19, 1.5, 1.5);

  // Weapon based on type
  drawAllyWeapon(a, isAttacking);

  // HP bar
  const hpRatio = a.hp / a.maxHp;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(-9, -28, 18, 4);
  ctx.fillStyle = hpRatio > 0.5 ? '#44ff66' : hpRatio > 0.25 ? '#ffcc00' : '#ff3333';
  ctx.fillRect(-9, -28, 18 * hpRatio, 4);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(-9, -28, 18, 4);

  // Attack flash ring
  if (isAttacking) {
    const attackAlpha = (a.atkTimer - a.atkSpeed * 0.7) / (a.atkSpeed * 0.3);
    ctx.strokeStyle = `rgba(255,255,255,${attackAlpha * 0.6})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -5, 16 + (1 - attackAlpha) * 8, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawAllyWeapon(a, isAttacking) {
  const atkFlash = isAttacking ? 1 : 0;

  if (a.type === 'archer') {
    // Bow
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(9, -8, 10, -1.2, 1.2);
    ctx.stroke();
    // Bowstring
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(9 + 10 * Math.cos(-1.2), -8 + 10 * Math.sin(-1.2));
    ctx.lineTo(9 + 10 * Math.cos(1.2), -8 + 10 * Math.sin(1.2));
    ctx.stroke();
    // Arrow
    if (atkFlash) {
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(6, -8);
      ctx.lineTo(20, -8);
      ctx.stroke();
    }
  } else if (a.type === 'mage') {
    // Staff
    ctx.strokeStyle = '#6633aa';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(8, -22);
    ctx.lineTo(8, 5);
    ctx.stroke();
    // Orb on staff (color cycling)
    const orbHue = (gameTime * 60) % 360;
    ctx.fillStyle = `hsl(${orbHue}, 80%, 60%)`;
    ctx.shadowColor = `hsl(${orbHue}, 80%, 60%)`;
    ctx.shadowBlur = atkFlash ? 12 : 6;
    ctx.beginPath();
    ctx.arc(8, -24, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  } else if (a.type === 'tank') {
    // Large shield
    ctx.fillStyle = 'rgba(50,100,200,0.6)';
    ctx.strokeStyle = '#88aaff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-11, -14);
    ctx.lineTo(-11, 4);
    ctx.lineTo(-5, 7);
    ctx.lineTo(1, 4);
    ctx.lineTo(1, -14);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Shield emblem
    ctx.fillStyle = '#aaccff';
    ctx.beginPath();
    ctx.arc(-5, -5, 3, 0, Math.PI * 2);
    ctx.fill();
  } else if (a.type === 'hero') {
    // Big sword (glowing)
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(9, -24);
    ctx.lineTo(9, 5);
    ctx.stroke();
    // Cross guard
    ctx.beginPath();
    ctx.moveTo(4, -12);
    ctx.lineTo(14, -12);
    ctx.stroke();
    // Blade glow
    ctx.strokeStyle = `rgba(255,215,0,${0.3 + Math.sin(gameTime * 5) * 0.2})`;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(9, -24);
    ctx.lineTo(9, 5);
    ctx.stroke();
    // Hero aura
    ctx.strokeStyle = `rgba(255,200,50,${0.15 + Math.sin(gameTime * 3) * 0.1})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, -5, 16, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    // Infantry: simple sword
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(8, -16);
    ctx.lineTo(8, 4);
    ctx.stroke();
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(5, -8);
    ctx.lineTo(11, -8);
    ctx.stroke();
  }
}

// ===== PROJECTILE DRAWING =====
function drawProjectile(p) {
  const rgb = hexToRgb(p.color);

  // Beam line from start to current position
  if (p.trail.length > 1) {
    // Outer glow beam
    ctx.strokeStyle = `rgba(${rgb},0.15)`;
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(p.trail[0].x, p.trail[0].y);
    for (let i = 1; i < p.trail.length; i++) {
      ctx.lineTo(p.trail[i].x, p.trail[i].y);
    }
    ctx.lineTo(p.x, p.y);
    ctx.stroke();

    // Inner beam
    ctx.strokeStyle = `rgba(${rgb},0.5)`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(p.trail[0].x, p.trail[0].y);
    for (let i = 1; i < p.trail.length; i++) {
      ctx.lineTo(p.trail[i].x, p.trail[i].y);
    }
    ctx.lineTo(p.x, p.y);
    ctx.stroke();

    // Core (white)
    ctx.strokeStyle = `rgba(255,255,255,0.6)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(p.trail[Math.max(0, p.trail.length - 4)].x, p.trail[Math.max(0, p.trail.length - 4)].y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  // Projectile head (bright glow)
  ctx.fillStyle = '#fff';
  ctx.shadowColor = p.color;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

// ===== BEAM FLASH =====
function drawBeamFlash(f) {
  const alpha = f.life / f.maxLife;
  const r = f.size * (1 + (1 - alpha) * 0.5);

  ctx.globalAlpha = alpha;
  const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
  grad.addColorStop(0, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.3, 'rgba(255,255,200,0.5)');
  grad.addColorStop(0.7, 'rgba(255,200,100,0.2)');
  grad.addColorStop(1, 'rgba(255,150,50,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

// ===== PARTICLE DRAWING =====
function drawParticle(p) {
  const alpha = p.life / p.maxLife;
  ctx.fillStyle = `rgba(${hexToRgb(p.color)},${alpha})`;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
  ctx.fill();
}

// ===== DAMAGE NUMBERS (MAJOR VISUAL UPGRADE) =====
function drawDmgNum(d) {
  const lifeRatio = d.life / d.maxLife;
  // Ease out alpha - stays visible longer then fades quickly at end
  const alpha = lifeRatio < 0.3 ? lifeRatio / 0.3 : 1;
  // Scale: starts big, slight pulse, then shrinks
  const entryT = 1 - lifeRatio;
  const s = d.scale * (entryT < 0.1 ? 0.5 + entryT * 5 : 1.0 - entryT * 0.15);
  const baseSize = d.isCrit ? 48 : 32;
  const size = baseSize * s;

  ctx.save();
  ctx.translate(d.x, d.y);

  const text = d.amount.toString();

  // Font setup - extra bold
  ctx.font = `900 ${size}px 'Helvetica Neue', Impact, Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Glow (only for crits and large numbers to save perf)
  if (d.isCrit || d.amount > 30) {
    const glowColor = d.isCrit ? '#ffee00' : (d.color === '#fff' ? '#4488ff' : d.color);
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = d.isCrit ? 20 : 12;
  }

  // Black outline (thick)
  ctx.strokeStyle = `rgba(0,0,0,${alpha})`;
  ctx.lineWidth = size * 0.15;
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  ctx.strokeText(text, 0, 0);

  // Main fill
  if (d.isCrit) {
    // Gradient fill for crits: yellow -> white -> yellow
    const critGrad = ctx.createLinearGradient(0, -size * 0.4, 0, size * 0.4);
    critGrad.addColorStop(0, '#ffee00');
    critGrad.addColorStop(0.5, '#ffffff');
    critGrad.addColorStop(1, '#ffcc00');
    ctx.fillStyle = critGrad;
  } else if (d.color === '#ff4444') {
    // Red damage
    ctx.fillStyle = `rgba(255,80,80,${alpha})`;
  } else {
    // White damage
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  }
  ctx.globalAlpha = alpha;
  ctx.fillText(text, 0, 0);

  ctx.shadowBlur = 0;

  // CRITICAL! text above
  if (d.isCrit) {
    ctx.font = `900 ${size * 0.35}px 'Helvetica Neue', Impact, Arial`;
    ctx.strokeStyle = `rgba(0,0,0,${alpha})`;
    ctx.lineWidth = 3;
    ctx.strokeText('CRITICAL!', 0, -size * 0.65);
    ctx.fillStyle = `rgba(255,50,50,${alpha})`;
    ctx.fillText('CRITICAL!', 0, -size * 0.65);
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

// ===== SHIELD EFFECT =====
function drawShield() {
  const yFrac = ROAD_BOTTOM_Y;
  const b = getRoadBounds(yFrac);
  const y = yFracToScreen(yFrac);
  const t = gameTime;
  const alpha = 0.15 + Math.sin(t * 3) * 0.08;

  // Shield dome
  const shieldGrad = ctx.createRadialGradient(b.cx, y - 25, 10, b.cx, y - 25, b.width * 0.6);
  shieldGrad.addColorStop(0, `rgba(0,200,255,${alpha * 0.5})`);
  shieldGrad.addColorStop(0.7, `rgba(0,150,255,${alpha})`);
  shieldGrad.addColorStop(1, 'rgba(0,100,255,0)');
  ctx.fillStyle = shieldGrad;
  ctx.beginPath();
  ctx.ellipse(b.cx, y - 25, b.width * 0.55, 50, 0, 0, Math.PI * 2);
  ctx.fill();

  // Shield edge glow
  ctx.strokeStyle = `rgba(100,220,255,${alpha + 0.15})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(b.cx, y - 25, b.width * 0.55, 50, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Hexagonal pattern (subtle)
  ctx.strokeStyle = `rgba(150,230,255,${alpha * 0.3})`;
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI * 2 / 6) * i + t * 0.5;
    const hr = 20;
    const hx = b.cx + Math.cos(angle) * hr;
    const hy = y - 25 + Math.sin(angle) * hr * 0.5;
    ctx.beginPath();
    ctx.arc(hx, hy, 8, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// ===== EFFECTS =====
function drawEffect(e) {
  const t = 1 - e.timer / e.maxTimer;

  if (e.type === 'heal') {
    ctx.fillStyle = `rgba(0,255,100,${(1 - t) * 0.12})`;
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 8; i++) {
      const ex = (i * W / 8) + W / 16;
      const ey = H * 0.5 - t * 120;
      const alpha = (1 - t);
      ctx.fillStyle = `rgba(0,255,100,${alpha})`;
      ctx.font = `bold ${20 + t * 10}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText('+', ex, ey);
    }
  } else if (e.type === 'portal') {
    ctx.fillStyle = `rgba(100,0,255,${(1 - t) * 0.15})`;
    ctx.fillRect(0, 0, W, H);
  } else if (e.type === 'shockwave') {
    const radius = t * 60;
    const alpha = (1 - t) * 0.5;
    ctx.strokeStyle = `rgba(${hexToRgb(e.color)},${alpha})`;
    ctx.lineWidth = 3 * (1 - t);
    ctx.beginPath();
    ctx.arc(e.x, e.y, radius, 0, Math.PI * 2);
    ctx.stroke();
    // Inner white ring
    ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.5})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(e.x, e.y, radius * 0.7, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawAnnouncement() {
  const el = document.getElementById('waveAnnounce');
  el.textContent = announceText;
  el.style.opacity = announceAlpha;
  el.style.transform = `translate(-50%,-50%) scale(${0.8 + announceAlpha * 0.4})`;
}

// ===== COLOR UTILITY =====
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  if (h.length === 3) {
    return `${parseInt(h[0]+h[0],16)},${parseInt(h[1]+h[1],16)},${parseInt(h[2]+h[2],16)}`;
  }
  return `${parseInt(h.substr(0,2),16)},${parseInt(h.substr(2,2),16)},${parseInt(h.substr(4,2),16)}`;
}

function darkenColor(hex, factor) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const r = Math.floor(parseInt(h.substr(0,2), 16) * factor);
  const g = Math.floor(parseInt(h.substr(2,2), 16) * factor);
  const b = Math.floor(parseInt(h.substr(4,2), 16) * factor);
  return `rgb(${r},${g},${b})`;
}

function lightenColor(hex, factor) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const r = Math.min(255, Math.floor(parseInt(h.substr(0,2), 16) * (1 + factor)));
  const g = Math.min(255, Math.floor(parseInt(h.substr(2,2), 16) * (1 + factor)));
  const b = Math.min(255, Math.floor(parseInt(h.substr(4,2), 16) * (1 + factor)));
  return `rgb(${r},${g},${b})`;
}

// ===== UI UPDATE =====
function updateUI() {
  document.getElementById('waveInfo').textContent = `WAVE ${currentWave}/${totalWaves}`;
  document.getElementById('goldInfo').textContent = `💰 ${gold}`;
  document.getElementById('scoreInfo').textContent = `SCORE: ${score}`;
  const hpPercent = Math.max(0, (baseHP / maxBaseHP) * 100);
  document.getElementById('hpBar').style.width = hpPercent + '%';
  if (hpPercent > 50) document.getElementById('hpBar').style.background = 'linear-gradient(90deg,#44ff44,#88ff44)';
  else if (hpPercent > 25) document.getElementById('hpBar').style.background = 'linear-gradient(90deg,#ffaa00,#ffcc00)';
  else document.getElementById('hpBar').style.background = 'linear-gradient(90deg,#ff4444,#ff6666)';
}

// ===== GAME LOOP =====
function gameLoop(timestamp) {
  if (lastTime === 0) lastTime = timestamp;
  dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (gameState === 'playing') {
    update(dt);
  }
  // Always draw (background/road visible behind start screen, fixes iOS blank canvas)
  draw();

  requestAnimationFrame(gameLoop);
}

// ===== GAME CONTROL =====
function startGame() {
  initAudio();
  document.getElementById('startScreen').style.display = 'none';
  resetGame();
  gameState = 'playing';
  buildUnitPanel();
  updateItemUI();
  updateUI();
  waveDelay = 2;
}

function resetGame() {
  gold = 100;
  score = 0;
  baseHP = 100;
  maxBaseHP = 100;
  currentWave = 0;
  waveActive = false;
  waveTimer = 0;
  waveDelay = 3;
  enemies = [];
  allies = [];
  projectiles = [];
  particles = [];
  damageNumbers = [];
  effects = [];
  beamFlashes = [];
  spawnQueue = [];
  selectedUnit = null;
  items = { airstrike: 2, heal: 2, shield: 1, portal: 1 };
  shieldActive = false;
  upgrades = { atk: 0, hp: 0, speed: 0 };
  gameTime = 0;
}

function restartGame() {
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('victoryScreen').style.display = 'none';
  resetGame();
  gameState = 'playing';
  buildUnitPanel();
  updateItemUI();
  updateUI();
  waveDelay = 2;
}

// roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);
    this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
    this.lineTo(x + w, y + h - r[2]);
    this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
    this.lineTo(x + r[3], y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
    this.lineTo(x, y + r[0]);
    this.quadraticCurveTo(x, y, x + r[0], y);
    this.closePath();
  };
}

// ===== BUTTON EVENT SETUP (iOS-compatible) =====
function addTapListener(el, fn) {
  if (!el) return;
  let touched = false;
  el.addEventListener('touchend', function(e) {
    e.preventDefault();
    touched = true;
    fn();
  }, { passive: false });
  el.addEventListener('click', function(e) {
    if (!touched) fn();
    touched = false;
  });
}
addTapListener(document.getElementById('startBtn'), startGame);
addTapListener(document.getElementById('retryBtn'), restartGame);
addTapListener(document.getElementById('replayBtn'), restartGame);
addTapListener(document.getElementById('closeUpgrade'), closeUpgrade);

// Item buttons
document.querySelectorAll('.item-btn').forEach(function(btn) {
  addTapListener(btn, function() { useItem(btn.dataset.item); });
});

// Start
requestAnimationFrame(gameLoop);
</script>
